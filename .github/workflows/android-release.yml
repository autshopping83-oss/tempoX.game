name: Android Release (AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set."
            exit 1
          fi
          # Strip newlines/CR/spaces: multiline base64 pastes corrupt the key silently.
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          # ABSOLUTE path: Gradle runs with workdir android/, so a repo-relative
          # value would resolve to android/android/app/... and silently miss.
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/release.keystore" >> "$GITHUB_ENV"
          test -s android/app/release.keystore || { echo "::error::Decoded keystore is empty — check KEYSTORE_BASE64."; exit 1; }
          file android/app/release.keystore

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean bundleRelease --no-daemon --stacktrace --no-build-cache

      - name: Verify AAB signature
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "::error::app-release.aab was not produced."; exit 1; }
          ls -lh "$AAB"
          # jarsigner validates .aab bundles (apksigner only handles APKs).
          jarsigner -verify "$AAB" > /tmp/jarsigner.log 2>&1 \
            || { echo "::error::AAB is NOT properly signed:"; cat /tmp/jarsigner.log; exit 1; }
          grep -i "jar verified" /tmp/jarsigner.log \
            || { echo "::error::Signature verification inconclusive:"; cat /tmp/jarsigner.log; exit 1; }
          echo "AAB signature verified OK."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping artifacts
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: release-mappings
          path: |
            android/app/build/outputs/mapping/release/
            android/app/build/outputs/bundle/release/output-metadata.json
