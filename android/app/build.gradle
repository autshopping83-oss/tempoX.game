apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'cloud.bizflow.tempox'
    compileSdk 35

    defaultConfig {
        applicationId 'cloud.bizflow.tempox'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        resourceConfigurations += ['pt', 'en']
    }

    // Release signing — populated in CI from GitHub Secrets:
    // KEYSTORE_BASE64 (decoded by the workflow), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
    // Accepts KEYSTORE_FILE (spec) or legacy KEYSTORE_PATH; default is app/release.keystore
    // relative to the android/ root project dir.
    signingConfigs {
        release {
            def keystoreFile = rootProject.file(
                System.getenv('KEYSTORE_FILE') ?: System.getenv('KEYSTORE_PATH') ?: 'app/release.keystore'
            )
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            def keystoreFile = rootProject.file(
                System.getenv('KEYSTORE_FILE') ?: System.getenv('KEYSTORE_PATH') ?: 'app/release.keystore'
            )
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            } else if (System.getenv('CI') == 'true') {
                // CI without a keystore must never ship an unsigned bundle silently.
                throw new GradleException('release.keystore not found in CI — refusing to produce an unsigned AAB.')
            } else {
                logger.warn('release.keystore not found - AAB will be unsigned.')
            }
        }
    }

    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.browser:browser:1.8.0'

    // Google Play Billing Client KTX (in-app purchases)
    implementation 'com.android.billingclient:billing-ktx:7.1.1'
    // Google Mobile Ads SDK (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    // Coroutines support for Play Services async calls (await())
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
}
